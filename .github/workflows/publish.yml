name: Publish image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push, tagged with the commit and as latest
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/loan-api
          docker build -f Dockerfile.prod -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE
          echo "Pushed $IMAGE:${{ github.sha }} and $IMAGE:latest"
